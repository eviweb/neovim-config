name: CI

# One run per commit: a topic branch is tested through its pull request (on the
# result of merging it into main), and main is tested after each merge. Listing
# the branch prefixes under `push` as well ran CI twice on the same commit, once
# for the push and once for the pull request. Tags never trigger CI.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.check.outputs.docs-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The workflow itself always runs (a required status check needs a run
      # to report against — a workflow that never triggers leaves a PR stuck
      # waiting forever). Instead, lint/test are skipped at the job level via
      # `if:` below when only documentation changed — GitHub reports a
      # job skipped by `if:` as satisfying a required check, unlike a
      # workflow that never ran at all.
      - name: Determine if only docs/text files changed
        id: check
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            before="${{ github.event.before }}"
            if [ -z "${before}" ] || [ "${before}" = "0000000000000000000000000000000000000000" ]; then
              # New branch or force-push with no known prior state — run everything.
              echo "docs-only=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            range="${before}..${{ github.sha }}"
          fi

          changed="$(git diff --name-only "${range}")"
          if [ -z "${changed}" ]; then
            echo "docs-only=false" >> "${GITHUB_OUTPUT}"
          elif printf '%s\n' "${changed}" | grep -qvE '\.md$|^docs/|^\.editorconfig$'; then
            echo "docs-only=false" >> "${GITHUB_OUTPUT}"
          else
            echo "docs-only=true" >> "${GITHUB_OUTPUT}"
          fi

  lint:
    name: Lint
    needs: detect-changes
    if: needs.detect-changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: shellcheck
        run: shellcheck bin/nvim-config scripts/ci-install-neovim tests/full-startup

  test:
    name: Test
    needs: detect-changes
    if: needs.detect-changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned by commit: v1.9.0 is an annotated tag and a tag can be moved.
      - name: Install bats-core
        run: |
          set -euo pipefail
          git init -q /tmp/bats-core
          git -C /tmp/bats-core fetch --depth 1 https://github.com/bats-core/bats-core.git 6636e2c2ef5ffe361535cb45fc61682c5ef46b71
          git -C /tmp/bats-core checkout -q FETCH_HEAD
          sudo /tmp/bats-core/install.sh /usr/local

      # Version and SHA-256 are pinned; see "Updating the pinned Neovim" in CONTRIBUTING.md.
      - name: Install Neovim v0.12.6
        run: scripts/ci-install-neovim v0.12.6 474430d53e6264f6d6dd18db42d6dc9df3a1b56ca9e88a325bbf860e1a811d87

      - name: Run tests
        run: tests/run

  # Starts the real configuration with all its plugins, on the oldest supported
  # Neovim and on the one used by the Test job. Not part of the required checks
  # of the main ruleset (Lint, Test): it clones about 200 MB of plugins, so a
  # network incident must not block a merge.
  startup:
    name: Startup ${{ matrix.nvim.version }}
    needs: detect-changes
    if: needs.detect-changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        nvim:
          - version: v0.11.0
            sha256: fe0a5bc79e64c5e4d9f844cd96157ebd3919ef1343b329e9ebc3f455924cc7d6
          - version: v0.12.6
            sha256: 474430d53e6264f6d6dd18db42d6dc9df3a1b56ca9e88a325bbf860e1a811d87
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Neovim ${{ matrix.nvim.version }}
        run: scripts/ci-install-neovim "${{ matrix.nvim.version }}" "${{ matrix.nvim.sha256 }}"

      - name: Start the configuration
        run: tests/full-startup
